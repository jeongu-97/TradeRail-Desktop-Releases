name: Publish Market Calendar

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

concurrency:
  group: market-calendar-publish
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: calendar/requirements.txt
      - name: Install latest compatible calendar library
        run: python -m pip install -r calendar/requirements.txt
      - name: Generate candidate
        run: |
          python calendar/generate_market_calendar.py \
            --output generated/market_calendar.v1.json
      - name: Validate candidate and non-regression
        run: |
          python calendar/validate_market_calendar_update.py \
            generated/market_calendar.v1.json \
            --current market_calendar.v1.json
      - uses: actions/upload-artifact@v7
        with:
          name: market-calendar-candidate
          path: generated/market_calendar.v1.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated candidate
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: market-calendar-candidate
          path: generated
      - name: Revalidate in the publisher job
        run: |
          python calendar/validate_market_calendar_update.py \
            generated/market_calendar.v1.json \
            --current market_calendar.v1.json
      - name: Atomically publish through Git
        run: |
          cp generated/market_calendar.v1.json market_calendar.v1.json
          if git diff --quiet -- market_calendar.v1.json; then
            echo "Published calendar is already current."
            exit 0
          fi
          git config user.name "TradeRail Calendar Bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add market_calendar.v1.json
          git commit -m "chore(calendar): refresh published market sessions"
          git push origin HEAD:main
